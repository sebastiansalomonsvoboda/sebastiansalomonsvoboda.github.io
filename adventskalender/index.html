<script>
'use strict';
const CHAPTERS=[{"n":1,"icon":"✨","category":"awareness","de":{"title":"Der erste goldene Stern","story":"In Winterhain fiel der erste Schnee. Mara entdeckte unter einer Laterne einen goldenen Umschlag. Darin lag ein Stern und eine Botschaft: „Vierundzwanzig Lichter fehlen. Jedes beginnt mit einem aufmerksamen Augenblick.“ Als sie aufsah, huschte ein roter Schlitten über den Mond. Ein kleines Glöckchen klang – und war wieder still. Als die Kirchenglocken läuteten, bemerkte sie die leere Sternenkrone über der Dorfkrippe. Irgendjemand hatte für jeden Tag bis Weihnachten eine Spur hinterlassen.","tip":"Bleib aufmerksam, ohne angespannt zu sein: Schau gelegentlich auf Umgebung, Wege und Menschen. Vorbereitung ist kein Leben in Angst.","heart":"Ein freundlicher Blick kann der Anfang von etwas Gutem sein.","q":"Welcher Umschlag gehört zu Maras erstem Hinweis?","opts":["A – Sternsiegel aus Gold","B – goldenes Band","C – rotes Sternsiegel"],"ans":0,"why":"Nur A erfüllt beide Bedingungen: Sternsiegel UND Gold.","next":"Am Bahnhof blinkt am nächsten Morgen ein zweiter Stern …","clue":"Drei Umschläge liegen im Schnee: A hat ein goldenes Sternsiegel, B nur ein goldenes Band, C ein rotes Sternsiegel. Auf dem Brief steht: »Nur das goldene Sternsiegel öffnet die erste Spur.«","good":"Schenke heute jemandem ein echtes, freundliches Kompliment.","faith":"Advent heißt: Ein Licht kommt in die Welt. Achtsamkeit kann ein erster Schritt zur Nächstenliebe sein."},"en":{"title":"The First Golden Star","story":"The first snow fell over Winterhaven. Beneath a streetlamp, Mara found a golden envelope containing a star and a note: “Twenty-four lights are missing. Each begins with a moment of awareness.” As she looked up, a red sleigh crossed the moon. A tiny bell rang—and fell silent. When the church bells rang, she noticed the empty star crown above the village nativity scene. Someone had left a clue for every day until Christmas.","tip":"Stay aware without being tense: notice your surroundings, routes and people. Preparation is not the same as living in fear.","heart":"A kind glance can be the beginning of something good.","q":"Which envelope belongs to Mara's first clue?","opts":["A – golden star seal","B – golden ribbon","C – red star seal"],"ans":0,"why":"Only A meets both conditions: a star seal AND gold.","next":"The next morning, a second star flashes at the station …","clue":"Three envelopes lie in the snow: A has a golden star seal, B only a golden ribbon, C a red star seal. The letter reads: 'Only the golden star seal opens the first clue.'","good":"Offer someone a sincere, kind compliment.","faith":"Advent reminds us that light enters the world. Awareness can be a first step toward love of neighbour."}},{"n":2,"icon":"🚉","category":"transport","de":{"title":"Die Bahnsteig-Botschaft","story":"Am Bahnhof war es ungewöhnlich ruhig. Auf der Anzeigetafel erschien plötzlich ein goldenes Herz. Mara wartete in der Nähe anderer Reisender und des Informationsschalters. Dort fand sie eine Karte: „Wer das Licht sucht, bleibt dort, wo Hilfe erreichbar ist.“ Als der Zug einfuhr, winkte ihr jemand hinter einem beschlagenen Fenster zu.","tip":"Warte bei wenig Betrieb möglichst in gut einsehbaren, belebteren Bereichen. Kenne Personal, Notrufeinrichtungen und sichere Ausgänge.","heart":"Du musst nicht alles allein schaffen.","q":"Welches Gleis ist eindeutig richtig?","opts":["Gleis 3","Gleis 2","Gleis 1"],"ans":1,"why":"Nur Gleis 2 führt zum richtigen Ziel und fährt vor 18:20.","next":"Ein unerwarteter Mitreisender trägt eine rote Mütze …","clue":"Auf der Tafel steht: Gleis 1 – Nordtor, 18:05. Gleis 2 – Lichterviertel, 18:12. Gleis 3 – Lichterviertel, 18:30. Der Hinweis lautet: »Lichterviertel, vor 18:20.«","good":"Bedanke dich bei einem Menschen, der anderen den Weg weist.","faith":"Christliche Gemeinschaft bedeutet: Niemand muss alles allein tragen."},"en":{"title":"The Message on the Platform","story":"The station was unusually quiet. A golden heart flashed on the departures board. Mara waited near other travellers and the information desk. There she found a card: “Those seeking the light stay where help is within reach.” As the train arrived, somebody waved through a misted-up window.","tip":"When it is quiet, wait in visible, more populated areas where possible. Know where staff, emergency points and safe exits are.","heart":"You do not have to manage everything alone.","q":"Which platform must Mara choose?","opts":["Platform 3","Platform 2","Platform 1"],"ans":1,"why":"Only platform 2 reaches the destination before 18:20.","next":"An unexpected passenger is wearing a red hat …","clue":"The board shows: platform 1 – North Gate, 18:05; platform 2 – Lantern Quarter, 18:12; platform 3 – Lantern Quarter, 18:30. The clue says: 'Lantern Quarter, before 18:20.'","good":"Thank someone who helps others find their way.","faith":"Christian community reminds us that nobody should have to carry every burden alone."}},{"n":3,"icon":"🧣","category":"people","de":{"title":"Der Fremde mit dem roten Schal","story":"Im Zug saß ein älterer Herr mit einem roten Schal. Er bemerkte, dass Mara nach einem Weg suchte, und zeigte auf die Beschilderung. „Der nächste Stern wartet im Lichterviertel“, sagte er. Mara bedankte sich, prüfte den Weg selbst auf dem offiziellen Linienplan und merkte sich, wo die Zugbegleiterin stand.","tip":"Beurteile Verhalten und Situation, nicht Alter, Kleidung oder Aussehen. Prüfe Informationen bei offiziellen Stellen und halte dir Optionen offen.","heart":"Freundlichkeit und gesunde Vorsicht dürfen zusammengehören.","q":"Welche Linie bestätigt den Hinweis?","opts":["Linie 8","Linie 2","Linie 6"],"ans":2,"why":"Die Zielangabe der Sternkarte stimmt allein mit Linie 6 überein.","next":"Im Lichterviertel wartet eine Einladung, die zu schön klingt …","clue":"Der Herr nennt Linie 6. Mara prüft den Linienplan: Linie 2 fährt zum Ostplatz, Linie 6 ins Lichterviertel, Linie 8 zur Kapelle. Auf der Sternkarte steht »Lichterviertel«.","good":"Frage eine vertraute Person, ob du ihr bei etwas helfen kannst.","faith":"Nächstenliebe und Klugheit gehören zusammen. Den anderen zu achten heißt auch, Grenzen zu respektieren."},"en":{"title":"The Stranger in the Red Scarf","story":"On the train, an older man wearing a red scarf noticed Mara looking for directions. He pointed to the signs. “The next star is waiting in the Lantern Quarter,” he said. Mara thanked him, verified the route on the official transit map and noted where the conductor was standing.","tip":"Judge behaviour and circumstances, not age, clothing or appearance. Verify directions with official information and keep your options open.","heart":"Kindness and sensible caution can go together.","q":"Which line confirms the clue?","opts":["Line 8","Line 2","Line 6"],"ans":2,"why":"Only line 6 matches the destination on the star card.","next":"In the Lantern Quarter, an invitation sounds almost too good …","clue":"The gentleman suggests line 6. Mara checks the official map: line 2 serves East Square, line 6 the Lantern Quarter, and line 8 the chapel. The star card says 'Lantern Quarter'.","good":"Ask someone you know whether you can help with a task.","faith":"Love of neighbour and wisdom belong together. Respecting others includes respecting boundaries."}},{"n":4,"icon":"🎪","category":"street","de":{"title":"Die Einladung hinter dem Markt","story":"Zwischen Zimtduft und Musik sprach eine Frau Mara an: „Komm schnell mit! Hinter dem Markt gibt es einen geheimen Weihnachtsraum.“ Mara lächelte, lehnte freundlich ab und blieb auf dem belebten Weg. Sekunden später entdeckte sie den vierten Stern am offiziellen Marktstand. Nicht jedes Angebot ist gefährlich – doch nicht jedes muss man annehmen.","tip":"Spontane Einladungen an unbekannte, abgelegene Orte musst du nicht annehmen. Ein ruhiges Nein und Abstand sind erlaubt.","heart":"Grenzen zu setzen ist auch eine Form von Selbstfürsorge.","q":"Welcher Widerspruch ist entscheidend?","opts":["Die behauptete Öffnungszeit passt nicht zum Marktplan.","Auf dem Markt riecht es nach Zimt.","Die Frau trägt einen Schal."],"ans":0,"why":"Die Zeiten widersprechen sich. Das ist ein überprüfbarer Hinweis; Aussehen ist keiner.","next":"Ein goldener Schlüssel hängt plötzlich am Marktbaum …","clue":"Die Frau nennt den geheimen Raum einen »offiziellen Marktstand, geöffnet bis 22 Uhr«. Der offizielle Marktplan nennt für alle Stände 16–20 Uhr. Es ist 20:30 Uhr.","good":"Sage freundlich Nein, wenn nötig – und respektiere auch das Nein anderer.","faith":"Jesus begegnete Menschen mit Würde und Mitgefühl. Auch ein klares Nein darf freundlich sein."},"en":{"title":"The Invitation Behind the Market","story":"Among cinnamon scents and music, a woman approached Mara: “Come quickly! There is a secret Christmas room behind the market.” Mara smiled, politely declined and stayed on the busy path. Moments later, she spotted the fourth star at the official market stall. Not every invitation is dangerous—but you never have to accept one.","tip":"You do not have to accept spontaneous invitations to unfamiliar, isolated places. A calm refusal and distance are reasonable.","heart":"Setting boundaries is also a way of caring for yourself.","q":"Which contradiction matters?","opts":["The claimed opening hours conflict with the official plan.","The market smells of cinnamon.","The woman wears a scarf."],"ans":0,"why":"The opening hours do not match. That is verifiable; appearance is not.","next":"A golden key suddenly appears on the market tree …","clue":"The woman calls the hidden room an 'official stall open until 10 pm'. The official market plan states that all stalls open from 4 to 8 pm. It is now 8:30 pm.","good":"Say no kindly when needed, and respect other people’s boundaries.","faith":"Jesus met people with dignity and compassion. A firm no can still be kind."}},{"n":5,"icon":"🏨","category":"hotel","de":{"title":"Das Zimmer mit dem Sternfenster","story":"Der Schlüssel führte Mara zu einem kleinen Gasthaus. Ihr Zimmer hatte ein Fenster in Sternform. Sie prüfte das Türschloss, sah nach dem Fluchtweg und stellte sicher, dass die Tür von innen leicht geöffnet werden konnte. Auf dem Nachttisch lag eine Karte: „Ein sicherer Ort hat immer einen freien Ausgang.“","tip":"Prüfe im Hotel Türverriegelung, Fluchtwege und den Zugang zu Hilfe. Blockiere keine Notausgänge mit Gepäck oder Möbeln.","heart":"Ein ruhiger Schlaf beginnt mit ein paar bewussten Handgriffen.","q":"Welchen Ausgang merkt sich Mara?","opts":["Treppe A","Treppe B","Das Zimmerfenster"],"ans":1,"why":"Treppe B ist der einzige im Plan als frei ausgewiesene Rettungsweg.","next":"Vor dem Gasthaus wartet ein kleiner Koffer mit einer Schleife …","clue":"Im Fluchtplan ist Treppe A wegen Bauarbeiten gesperrt, Treppe B als freier Notausgang markiert. Das Zimmerfenster ist kein ausgewiesener Rettungsweg.","good":"Hilf zuhause, einen sicheren und freien Durchgang zu schaffen.","faith":"Ein sicherer Ort schafft Raum für Ruhe und Dankbarkeit."},"en":{"title":"The Room with the Star Window","story":"The key led Mara to a small inn. Her room had a star-shaped window. She checked the door lock, located the escape route and made sure the door could be opened easily from inside. On the bedside table lay a card: “A safe place always has a clear way out.”","tip":"At a hotel, check the door lock, escape routes and how to reach help. Never block an emergency exit with luggage or furniture.","heart":"A peaceful night begins with a few thoughtful checks.","q":"Which exit should Mara remember?","opts":["Staircase A","Staircase B","The bedroom window"],"ans":1,"why":"Staircase B is the only clearly open designated exit.","next":"A small ribbon-wrapped suitcase is waiting outside the inn …","clue":"On the evacuation plan, staircase A is closed for construction and staircase B is marked as an open emergency exit. The bedroom window is not a designated escape route.","good":"Help keep a safe, clear passage at home.","faith":"A safe place makes room for peace and gratitude."}},{"n":6,"icon":"🧳","category":"travel","de":{"title":"Der Koffer auf vier Rollen","story":"Vor dem Gasthaus stand ein handlicher Rollkoffer. Am Griff hing ein Zettel: „Nimm nur mit, was dich wirklich begleitet.“ Mara packte leicht, befestigte eine kleine Tasche am Griff und behielt ihr Gepäck in Sicht. Als eine Rolle im Schnee stecken blieb, half ihr die Wirtin. Unter dem Koffer glitzerte Stern Nummer sechs.","tip":"Wähle Reisegepäck nach Bedarf und örtlichen Regeln. Behalte Wertsachen unter Kontrolle; ein Tracker kann helfen, ersetzt aber keine Aufmerksamkeit.","heart":"Leichtes Gepäck lässt Platz für schöne Erinnerungen.","q":"Welcher Koffer verbirgt den Stern?","opts":["Der rote","Der blaue","Der grüne"],"ans":2,"why":"Nur der grüne Koffer vereint beide Merkmale.","next":"Im Café flimmert ein unbekanntes WLAN-Netz …","clue":"Drei Koffer tragen Sterne: Der blaue hat vier Rollen und ein rotes Band. Der rote hat zwei Rollen und ein gelbes Band. Der grüne hat vier Rollen und ein gelbes Band. Auf dem Zettel steht: »Vier Rollen, gelbes Band.«","good":"Spende ein gut erhaltenes Kleidungsstück oder Reiseutensil.","faith":"Teilen beginnt oft mit Dingen, die wir nicht mehr benötigen."},"en":{"title":"The Four-Wheeled Suitcase","story":"Outside the inn stood a compact rolling suitcase. A note hung from its handle: “Take only what truly needs to travel with you.” Mara packed light, attached a small tote to the handle and kept her luggage in sight. When a wheel caught in the snow, the innkeeper helped. Beneath the suitcase, star number six sparkled.","tip":"Choose luggage that suits your needs and local rules. Keep valuables under control; a tracker may help but cannot replace awareness.","heart":"Light luggage leaves room for wonderful memories.","q":"Which suitcase hides the star?","opts":["The red one","The blue one","The green one"],"ans":2,"why":"Only the green suitcase meets both clues.","next":"An unfamiliar Wi-Fi network appears in the café …","clue":"Three suitcases carry star tags: the blue one has four wheels and a red ribbon, the red one two wheels and a yellow ribbon, the green one four wheels and a yellow ribbon. The note says: 'Four wheels, yellow ribbon.'","good":"Donate useful clothing or a travel item in good condition.","faith":"Sharing often begins with things we no longer need."}},{"n":7,"icon":"📶","category":"digital","de":{"title":"Das falsche Weihnachts-WLAN","story":"Im Café erschienen zwei Netze: „Winterhain_Gast“ und „Winterhain_Gratis_Sofort“. Eines versprach Geschenke für eine schnelle Anmeldung. Mara fragte das Personal nach dem echten Netz und vermied sensible Logins, bis sie die Verbindung prüfen konnte. Plötzlich leuchtete auf dem Zuckerstreuer der siebte Stern. Auf dem Weg zur Kapelle sah Mara ein helles Fenster, hinter dem Freiwillige Lebensmittel für Familien packten.","tip":"Prüfe öffentliche WLAN-Namen bei der Einrichtung. Nutze sichere Verbindungen und aktualisierte Geräte; ein VPN ist nur eine zusätzliche Schutzmaßnahme, kein Allheilmittel.","heart":"Ein Moment Geduld kann viel Ruhe schenken.","q":"Welches WLAN stimmt exakt mit der offiziellen Angabe überein?","opts":["Winterhain_Gast","Winterhain_Gratis_Sofort","Winterhain_Gaste"],"ans":0,"why":"Nur die exakt bestätigte Schreibweise passt; ähnlich klingende Namen sind keine Bestätigung.","next":"Draußen wird es dunkel, doch der Weg beginnt erst …","clue":"Das Cafépersonal zeigt auf einem Aushang den Netzwerknamen »Winterhain_Gast«. Auf Maras Telefon erscheinen »Winterhain_Gast«, »Winterhain_Gratis_Sofort« und »Winterhain_Gaste«.","good":"Hilf jemandem freundlich beim Einrichten einer sicheren Verbindung.","faith":"Wahrhaftigkeit ist eine christliche Tugend: Prüfe, was dir versprochen wird."},"en":{"title":"The Fake Christmas Wi-Fi","story":"Two networks appeared at the café: “Winterhaven_Guest” and “Winterhaven_Free_Instant.” One promised gifts for a quick sign-up. Mara asked the café staff which network was genuine and avoided sensitive logins until she could verify the connection. Star seven lit up on the sugar bowl. On the way to the chapel, Mara saw volunteers packing food parcels for families behind a warmly lit window.","tip":"Confirm public Wi-Fi names with the venue. Use secure connections and updated devices; a VPN is an extra precaution, not a complete solution.","heart":"A moment of patience can bring peace of mind.","q":"Which Wi-Fi name exactly matches the verified notice?","opts":["Winterhaven_Guest","Winterhaven_Free_Now","Winterhaven_Guests"],"ans":0,"why":"Only the exact confirmed spelling matches.","next":"Night falls, but the journey is only beginning …","clue":"Café staff point to a notice listing the official network as 'Winterhaven_Guest'. Mara's phone lists 'Winterhaven_Guest', 'Winterhaven_Free_Now' and 'Winterhaven_Guests'.","good":"Kindly help someone set up a safer internet connection.","faith":"Truthfulness is a Christian virtue: examine what you are promised."}},{"n":8,"icon":"🔦","category":"night","de":{"title":"Die Laterne im Schneetreiben","story":"Eine Windböe löschte die Lichter am kleinen Park. Mara blieb auf der beleuchteten Hauptstraße, nutzte ihre kompakte Taschenlampe für den Weg vor sich und ging in Richtung eines noch offenen Geschäfts. Über ihr erschien Stern Nummer acht. Auf seinem Rand stand: „Helligkeit ist gut. Ein sicherer Weg ist besser.“","tip":"Nutze nach Einbruch der Dunkelheit möglichst gut beleuchtete, belebte Wege. Eine Taschenlampe kann die Sicht verbessern; sichere sie gegen unbeabsichtigtes Einschalten beim Tragen.","heart":"Der beste Weg ist nicht immer der kürzeste.","q":"Welcher Weg erfüllt beide Bedingungen »offen« und »beleuchtet«?","opts":["Parkweg","Kirchweg","Flussweg"],"ans":1,"why":"Allein der Kirchweg erfüllt beide Bedingungen.","next":"Ein schwarzes Auto fährt ungewöhnlich langsam vorbei …","clue":"Ein Ortsplan zeigt drei Wege zum Gasthaus: Parkweg – geschlossen; Flussweg – unbeleuchtet; Kirchweg – geöffnet und beleuchtet. Der Sturm wird stärker.","good":"Achte beim Abendspaziergang auf die Bedürfnisse einer Begleitperson.","faith":"Das Licht weist den Weg; Hoffnung trägt uns weiter."},"en":{"title":"The Lantern in the Snowstorm","story":"A gust extinguished the lights along the small park. Mara stayed on the brighter main street, used her compact flashlight to see the path ahead and walked towards an open shop. Above her appeared star eight. Along its edge were the words: “Light is good. A safer route is better.”","tip":"After dark, favour well-lit, more populated routes. A flashlight can improve visibility; lock it against accidental activation when carrying it.","heart":"The best route is not always the shortest.","q":"Which path is both open and illuminated?","opts":["Park path","Church path","Riverside path"],"ans":1,"why":"Only the church path meets both requirements.","next":"A dark car passes unusually slowly …","clue":"A map shows three routes to the inn: park path – closed; riverside path – unlit; church path – open and illuminated. The snowstorm is getting stronger.","good":"Check whether your walking companion feels comfortable and safe.","faith":"Light helps us see a path; hope helps us continue."}},{"n":9,"icon":"🚕","category":"car","de":{"title":"Die Scheinwerfer im Schnee","story":"Ein Auto rollte langsam an Mara vorbei. Es musste nichts bedeuten. Trotzdem ging sie aufmerksam weiter und rief aus einem beleuchteten Laden ihre Freundin Leo an. Später im Taxi bestätigte sie die Fahrtinformationen, bevor sie einstieg. In der Fensterspiegelung schimmerte Stern neun.","tip":"Bei Unsicherheit im Straßenverkehr nicht provozieren. Wenn du glaubst, verfolgt zu werden, suche einen sicheren, belebten Ort und kontaktiere nötigenfalls die Polizei; führe niemanden absichtlich nach Hause.","heart":"Du darfst vorsichtig sein, ohne vorschnell zu urteilen.","q":"Welches Kennzeichen stimmt exakt?","opts":["ZH 5378","ZH 573B","ZH 5738"],"ans":2,"why":"Nur »ZH 5738« ist identisch – auch die Reihenfolge der Ziffern zählt.","next":"Ein geheimnisvolles Foto erscheint auf Maras Telefon …","clue":"Die Buchungsbestätigung zeigt das Taxi-Kennzeichen »ZH 5738«. Vor der Tür stehen »ZH 5378«, »ZH 573B« und »ZH 5738«. Mara vergleicht Zeichen für Zeichen.","good":"Biete an, mit einer vertrauten Person eine sichere Heimfahrt zu organisieren.","faith":"Frieden wächst dort, wo wir nicht provozieren, sondern ruhig handeln."},"en":{"title":"Headlights in the Snow","story":"A car rolled slowly past Mara. It might have meant nothing. Still, she kept aware and called her friend Leo from a well-lit shop. Later, before entering a taxi, she checked the trip details. In the window reflection, star nine shimmered.","tip":"Do not provoke people in traffic. If you reasonably believe you are being followed, seek a safe, populated place and contact police if necessary; do not deliberately lead someone home.","heart":"You can be cautious without jumping to conclusions.","q":"Which plate matches exactly?","opts":["ZH 5378","ZH 573B","ZH 5738"],"ans":2,"why":"Only 'ZH 5738' is identical; digit order matters too.","next":"A mysterious photograph appears on Mara’s phone …","clue":"The ride confirmation lists plate 'ZH 5738'. Outside are vehicles marked 'ZH 5378', 'ZH 573B' and 'ZH 5738'. Mara compares every character.","good":"Offer to help someone you know arrange a safe trip home.","faith":"Peace grows when we respond calmly rather than provoke."}},{"n":10,"icon":"🗺️","category":"preparation","de":{"title":"Die Karte mit den fehlenden Ecken","story":"Maras Telefon zeigte ein altes Foto des Dorfplatzes. Auf der Rückseite einer echten Papierkarte fand sie dieselben Zeichen – nur fehlten zwei Ecken. Leo, ihre Freundin, schickte ihr eine gespeicherte Offline-Karte. Gemeinsam fanden sie den zehnten Stern neben der Bibliothek. Dort wartete ein weiterer Umschlag.","tip":"Speichere Reiseunterlagen, wichtige Adressen und Karten nach Möglichkeit auch offline. Halte eine sichere Kopie wichtiger Dokumente bereit.","heart":"Vorbereitung schafft Freiraum für spontane schöne Momente.","q":"Welche Reihenfolge ergibt sich zwingend?","opts":["Brücke → Kirche → Bibliothek","Kirche → Brücke → Bibliothek","Bibliothek → Kirche → Brücke"],"ans":0,"why":"Die Brücke muss vor der Kirche liegen, die Bibliothek danach.","next":"Im nächsten Zug braucht jemand dringend Unterstützung …","clue":"Auf der Karte steht: »Die Brücke kommt vor der Kirche. Die Bibliothek kommt nach der Kirche.« Nur drei Stationen sind eingezeichnet.","good":"Teile einer nahestehenden Person einen zuverlässigen Wegplan mit.","faith":"Wer sich Zeit nimmt, findet manchmal einen besseren Weg, anderen beizustehen."},"en":{"title":"The Map with Missing Corners","story":"Mara’s phone displayed an old photograph of the village square. On the back of a paper map she found the same symbols—except two corners were missing. Her friend Leo sent an offline map she had saved. Together, they found the tenth star beside the library. Another envelope was waiting there.","tip":"Keep key travel documents, addresses and maps available offline when practical. Maintain a securely stored copy of important documents.","heart":"Preparation leaves space for lovely spontaneous moments.","q":"Which sequence follows logically?","opts":["Bridge → Church → Library","Church → Bridge → Library","Library → Church → Bridge"],"ans":0,"why":"The bridge must come before the church, and the library after it.","next":"On the next train, somebody urgently needs support …","clue":"The map says: 'The bridge comes before the church. The library comes after the church.' Only three stops are shown.","good":"Share a reliable route with someone close to you.","faith":"Taking time can reveal a better way to care for others."}},{"n":11,"icon":"🤝","category":"transport","de":{"title":"Ein Satz, der hilft","story":"Im Zug wirkte eine Reisende verunsichert. Mara blieb in sicherem Abstand und fragte, ob sie Unterstützung brauche. „Bitte sprechen Sie das Zugpersonal an“, antwortete die Frau. Mara wandte sich gezielt an einen Mann neben der Tür: „Sie mit dem blauen Mantel, bitte holen Sie die Zugbegleiterin.“ Der elfte Stern erschien über dem Notrufpunkt.","tip":"Bitte Menschen konkret um Hilfe: Sprich eine Person direkt an und nenne eine klare Aufgabe. Bei akuter Gefahr Personal oder örtlichen Notruf kontaktieren.","heart":"Ein klarer Satz kann jemandem das Gefühl geben, nicht allein zu sein.","q":"Wen spricht Mara gezielt an?","opts":["Den Mann in Rot am Ausgang","Den Mann in Blau an der Sprechstelle","Den Mann in Blau am Fenster"],"ans":1,"why":"Farbe UND Standort müssen stimmen. So wird die Bitte eindeutig.","next":"Der Weihnachtsmarkt wird immer voller …","clue":"Eine Frau bittet: »Sprich mit dem Mann im blauen Mantel direkt bei der Notrufsprechstelle.« Im Wagen stehen ein Mann im roten Mantel am Ausgang, einer in Blau an der Sprechstelle und einer in Blau am Fenster.","good":"Bedanke dich bei Mitarbeitenden, die Menschen im Alltag unterstützen.","faith":"Wie beim barmherzigen Samariter zählt praktische Hilfe, nicht bloß gute Absicht (Lukas 10)."},"en":{"title":"One Sentence That Helps","story":"A passenger on the train seemed unsettled. Keeping a safe distance, Mara asked whether she needed assistance. “Please tell the conductor,” the woman replied. Mara spoke directly to a man near the door: “You in the blue coat, please get the train staff.” Star eleven appeared above the emergency intercom.","tip":"Ask for help specifically: address a person directly and give a clear task. In immediate danger, alert staff or call local emergency services.","heart":"A clear sentence can help someone feel less alone.","q":"Whom should Mara address specifically?","opts":["The man in red by the exit","The man in blue at the intercom","The man in blue by the window"],"ans":1,"why":"Both the coat colour AND location identify the right person.","next":"The Christmas market is becoming more crowded …","clue":"A passenger says: 'Please speak to the man in the blue coat next to the emergency intercom.' There are three men: one in red by the exit, one in blue at the intercom and one in blue by a window.","good":"Thank staff who help people every day.","faith":"Like the Good Samaritan, real compassion becomes practical help (Luke 10)."}},{"n":12,"icon":"🎄","category":"street","de":{"title":"Das Herz im Gedränge","story":"Am Weihnachtsmarkt tanzten rote Herzen zwischen den Lichterketten. Mara sah eine Familie, die nach dem Treffpunkt suchte. Sie verwies auf den Informationsstand und merkte sich selbst den nächsten Ausgang. Dann entdeckte sie Stern zwölf in einem Kranz. Die Hälfte der Lichter war gefunden – aber das Geheimnis blieb ungelöst. In der Kapelle probten Kinder ein Weihnachtslied; die Glocken waren zum Zeichen der Gemeinschaft geworden.","tip":"An belebten Orten lohnt es sich, Ausgänge und Treffpunkte kurz zu beachten. Bewahre Wertsachen so auf, dass du sie kontrollieren kannst.","heart":"Mitten im Trubel kann ein kleiner Moment der Orientierung viel bewirken.","q":"Welcher Treffpunkt erfüllt alle Hinweise?","opts":["Die Bühne","Die Bäckerei","Die Kapelle"],"ans":2,"why":"Zeit und Glocken führen gemeinsam zur Kapelle.","next":"Der Weihnachtsmann hinterlässt eine Botschaft aus Papierherzen …","clue":"Eine Familie hat vereinbart: »Treffen um 17 Uhr dort, wo die Kirchenglocken läuten.« Auf dem Markt gibt es eine Bühne um 17 Uhr, die Kapelle mit Glocken um 17 Uhr und die Bäckerei um 18 Uhr.","good":"Verabrede einen gut erkennbaren Treffpunkt mit deiner Familie.","faith":"Familie und Gemeinschaft sind Geschenke, die wir pflegen dürfen."},"en":{"title":"The Heart in the Crowd","story":"Red hearts danced among the market lights. Mara saw a family searching for their meeting place and pointed them towards the information desk. She also noted the nearest exit. Then she found star twelve in a wreath. Half the lights were found—but the mystery remained unsolved. Children were rehearsing a Christmas carol in the chapel; the bells had become a symbol of community.","tip":"In busy places, briefly identify exits and meeting points. Keep valuables in a way you can control.","heart":"Even in a crowd, one moment of awareness can make a difference.","q":"Which meeting place satisfies all clues?","opts":["The stage","The bakery","The chapel"],"ans":2,"why":"The time and the bells point to the chapel together.","next":"Santa leaves a message made of paper hearts …","clue":"A family agreed: 'Meet at 5 pm where the church bells ring.' The market has a stage at 5 pm, a bell-tower chapel at 5 pm and a bakery at 6 pm.","good":"Agree on a clear meeting place with your family.","faith":"Family and community are gifts worth caring for."}},{"n":13,"icon":"💌","category":"people","de":{"title":"Der Brief mit drei Herzen","story":"Hinter dem Markt hing ein Brief mit drei roten Herzen. „Ein Licht für dich. Eines für jemanden, den du liebst. Und eines für einen Menschen, der heute Hilfe braucht.“ Mara schrieb Leo eine kurze Nachricht: „Bin gut angekommen. Melde mich nach dem Abendessen.“ Auf ihrer Handfläche leuchtete plötzlich Stern dreizehn.","tip":"Vereinbare bei Reisen einen einfachen Kontaktplan: Wer weiß, wo du bist, und wann meldest du dich wieder?","heart":"Ein kurzes „Ich bin gut angekommen“ ist manchmal das schönste Geschenk.","q":"Welches Wort ergibt sich rückwärts entschlüsselt?","opts":["NACHT","LICHT","LIEBE"],"ans":1,"why":"M→L, J→I, D→C, I→H, U→T: LICHT.","next":"Aus der Ferne kommt ein geheimnisvolles Paket …","clue":"Auf der Rückseite des Briefs steht »MJDIU«. Darunter: »Jeder Buchstabe wurde im Alphabet um eins nach vorne verschoben.« Mara denkt an die Weihnachtsbotschaft.","good":"Schreibe einer Person eine aufrichtige, ermutigende Nachricht.","faith":"Glaube, Hoffnung und Liebe bleiben – und die Liebe verbindet uns (1 Korinther 13)."},"en":{"title":"The Letter with Three Hearts","story":"A letter with three red hearts hung behind the market. “One light for you. One for someone you love. And one for a person who needs help today.” Mara sent Leo a short message: “Arrived safely. I’ll check in after dinner.” Suddenly star thirteen glowed in her palm.","tip":"Agree on a simple travel check-in plan: who knows where you are, and when do you expect to contact them again?","heart":"A quick “I got here safely” can be a wonderful gift.","q":"What word appears when you shift each letter back?","opts":["NIGHT","LIGHT","PEACE"],"ans":1,"why":"M→L, J→I, H→G, I→H, U→T gives LIGHT.","next":"A mysterious parcel arrives from far away …","clue":"On the back of the letter is the code 'MJHIU'. It says: 'Each letter has been shifted forward by one in the alphabet.' Mara thinks of the Christmas message.","good":"Send someone a sincere, encouraging message.","faith":"Faith, hope and love endure, and love binds us together (1 Corinthians 13)."}},{"n":14,"icon":"✈️","category":"travel","de":{"title":"Das Paket aus Wolkenpapier","story":"Der Postbote brachte ein Päckchen, das in Wolkenpapier gehüllt war. Darin lag kein Geschenk, sondern eine Liste für die bevorstehende Reise: Dokumente, Medikamente, Ladegerät. Mara prüfte die geltenden Flugregeln und packte ihre Powerbank ins Handgepäck. Beim Schließen des Koffers glühte Stern vierzehn.","tip":"Prüfe aktuelle Airline- und Flughafenregeln. Powerbanks und lose Lithium-Ersatzakkus gehören in der Regel ins Handgepäck, nicht ins Aufgabegepäck.","heart":"Gute Planung ist eine liebevolle Aufmerksamkeit dir selbst gegenüber.","q":"Was gehört zuerst ins leicht erreichbare Handgepäck?","opts":["Pralinen","Nur Ersatzsocken","Reisepass und benötigte Medikamente"],"ans":2,"why":"Unverzichtbare Dokumente und notwendige Medikamente sollten erreichbar bleiben; geltende Transportregeln beachten.","next":"Das nächste Licht wartet hinter einer ruhigen Zimmertür …","clue":"Mara hat drei Dinge: A warme Ersatzsocken, B Reisepass plus benötigte Medikamente, C eine zweite Schachtel Pralinen. Ihr Aufgabe lautet: »Was muss unterwegs jederzeit greifbar bleiben?«","good":"Stelle ein kleines Hilfspaket für jemanden zusammen, der es braucht.","faith":"Die Weihnachtsgeschichte erzählt von Gastfreundschaft, Bescheidenheit und einem offenen Herzen."},"en":{"title":"The Parcel Wrapped in Cloud Paper","story":"The postman delivered a parcel wrapped in cloud-like paper. Inside was no gift, but a checklist for the journey ahead: documents, medication and a charger. Mara checked current flight rules and packed her power bank in her cabin bag. As she closed her suitcase, star fourteen glowed.","tip":"Check current airline and airport rules. Power banks and spare loose lithium batteries generally belong in cabin baggage, not checked luggage.","heart":"Good planning is a small act of kindness towards yourself.","q":"Which belongs in easily reachable carry-on luggage first?","opts":["Chocolate","Only spare socks","Passport and necessary medication"],"ans":2,"why":"Essential documents and needed medicine should remain accessible, subject to applicable travel rules.","next":"The next light awaits behind a quiet hotel-room door …","clue":"Mara has three items: A spare warm socks, B passport and necessary medication, C another box of chocolates. Her clue says: 'What must remain accessible during travel?'","good":"Prepare a small helpful care package for someone who needs it.","faith":"The Christmas story speaks of hospitality, humility and an open heart."}},{"n":15,"icon":"🕯️","category":"hotel","de":{"title":"Das Zimmer der tausend Lichter","story":"Im Gasthaus standen kleine elektrische Kerzen im Flur. Hinter einer Tür war Musik zu hören, hinter der anderen nur der Wind. Mara überprüfte ruhig den Weg zur Treppe und legte ihre wichtigsten Sachen griffbereit. Als sie das Licht ausmachte, schimmerte Stern fünfzehn an der Zimmerdecke.","tip":"Eine kurze Orientierung im Hotel hilft: Ausgang, Treppenhaus, Rezeption und lokale Notfallinformationen kennen. Beachte Hausregeln und Brandschutz.","heart":"Ruhe entsteht oft aus einfachen, bewussten Routinen.","q":"Welcher Pfeil zeigt zum vorgesehenen Ausgang?","opts":["Blau","Rot","Gold"],"ans":0,"why":"Nur die blaue Markierung führt zum bezeichneten Ausgang ins Freie.","next":"Der Morgen bringt eine überraschende Sturmwarnung …","clue":"Auf dem Flurplan führt der blaue Pfeil zur markierten Außentür. Der rote führt in den Lagerraum. Der goldene endet auf einer Dachterrasse ohne Außentreppe.","good":"Sorge dafür, dass ein Weg oder Ausgang für andere frei bleibt.","faith":"Ein Licht im Fenster kann an Gottes Nähe und an unsere Verantwortung erinnern."},"en":{"title":"The Room of a Thousand Lights","story":"Small electric candles lined the inn’s hallway. Music played behind one door; behind another, only the wind could be heard. Mara calmly checked the stairway route and placed important belongings within easy reach. When she switched off the light, star fifteen shimmered on the ceiling.","tip":"A quick hotel orientation helps: know the exits, stairs, reception and local emergency information. Follow house rules and fire-safety guidance.","heart":"Peace of mind often comes from small, thoughtful routines.","q":"Which arrow points to the designated exit?","opts":["Blue","Red","Gold"],"ans":0,"why":"Only the blue arrow leads to the marked outside exit.","next":"Morning brings an unexpected storm warning …","clue":"On the hallway plan, the blue arrow leads to a designated exterior exit. The red one leads to a storeroom; the gold one to a roof terrace without an exterior stairway.","good":"Help keep a hallway or exit clear for others.","faith":"A candlelit window can remind us of God’s presence and our responsibility."}},{"n":16,"icon":"❄️","category":"travel","de":{"title":"Der Sturm über Winterhain","story":"Über Nacht hatte ein Schneesturm die Bergstraße gesperrt. Der Weihnachtsmarkt öffnete später, und die Schlittenbahn blieb stehen. Mara überprüfte die örtlichen Meldungen und änderte ihren Plan. Auf der Rückseite des Wetterberichts erschien Stern sechzehn: „Der beste Plan ist der, den du anpassen kannst.“","tip":"Prüfe vor Ausflügen offizielle Reise- und Wetterhinweise, zum Beispiel das EDA bei Auslandsreisen. Aktuelle Hinweise und örtliche Anweisungen gehen vor alten Plänen.","heart":"Flexibilität ist keine Schwäche, sondern Umsicht.","q":"Welche Verbindung ist nach den Hinweisen nutzbar?","opts":["Der Bus um 16 Uhr","Die bestätigte Bahn um 16:20","Beide gleich sicher"],"ans":1,"why":"Die bestätigte Bahn nutzt nicht die gesperrte Straße. Vor der Fahrt aktuelle Meldungen prüfen.","next":"Ein unbekannter Gast kennt angeblich den schnellsten Weg …","clue":"Der Sturm sperrt die Bergstraße von 15 bis 19 Uhr. Der Bus fährt um 16 Uhr über diese Straße. Die Bahn fährt um 16:20 über eine freie Strecke; der Bahnhof bestätigt den Betrieb.","good":"Unterstütze jemanden bei einer notwendigen Planänderung.","faith":"Wer achtsam mit anderen umgeht, trägt dazu bei, dass Gemeinschaft stärker wird."},"en":{"title":"The Storm over Winterhaven","story":"An overnight snowstorm had closed the mountain road. The Christmas market opened late and the sleigh service stopped. Mara checked local official updates and changed her plans. On the back of the weather report appeared star sixteen: “The best plan is one you can adjust.”","tip":"Before outings, check official travel and weather advice, such as Swiss FDFA guidance for international travel. Current alerts and local instructions take priority over old plans.","heart":"Flexibility is not weakness; it is good judgement.","q":"Which service is supported by the clues?","opts":["The 4 pm bus","The confirmed 4:20 pm train","Both equally"],"ans":1,"why":"The confirmed train does not use the closed road. Always recheck current notices before travelling.","next":"A new visitor claims to know the fastest route …","clue":"The storm closes the mountain road from 3 to 7 pm. The 4 pm bus uses that road. The 4:20 pm train runs on an open route, and the station confirms service.","good":"Support someone who has to change their travel plans.","faith":"Caring for one another helps make a community stronger."}},{"n":17,"icon":"🧭","category":"awareness","de":{"title":"Der Wegweiser ohne Namen","story":"Ein Besucher bot Mara eine Abkürzung durch einen gesperrten Park an. Er lächelte und schien nett – doch das Schild war eindeutig. Mara bedankte sich und wählte den freigegebenen Weg. An der nächsten Kreuzung wartete Stern siebzehn. Auf ihm stand: „Hör zu. Denk nach. Entscheide selbst.“","tip":"Gute Entscheidungen brauchen keine Vorurteile. Achte auf Regeln, konkrete Umstände, verfügbare Hilfe und dein eigenes Sicherheitsgefühl.","heart":"Du darfst deine Meinung ändern und einen anderen Weg wählen.","q":"Welcher Hinweis entscheidet über die sinnvolle Route?","opts":["Der freundliche Eindruck eines Fremden","Die kürzere Entfernung","Die offizielle Sperrung und der beleuchtete Alternativweg"],"ans":2,"why":"Eine offizielle Sperrung und der sichere Alternativweg sind konkrete Informationen.","next":"Ein digitales Weihnachtsgeschenk ist plötzlich „dringend“ …","clue":"Ein Schild sagt »Park bis morgen gesperrt«. Daneben weisen Pfeile zur offenen Hauptstraße (beleuchtet) und zur unbekannten Schlucht-Abkürzung (unbeleuchtet).","good":"Frage freundlich nach, wenn jemand Orientierung sucht – ohne dich aufzudrängen.","faith":"Barmherzigkeit beginnt mit dem Blick auf das, was jemand wirklich braucht."},"en":{"title":"The Signpost without a Name","story":"A visitor offered Mara a shortcut through a closed park. He smiled and seemed friendly—but the sign was clear. Mara thanked him and chose the permitted route. At the next junction, star seventeen waited. It read: “Listen. Think. Decide for yourself.”","tip":"Sound decisions need no stereotypes. Look at rules, actual circumstances, available help and your own sense of safety.","heart":"You are allowed to change your mind and choose another way.","q":"Which information should guide the route?","opts":["A stranger's friendly appearance","The shortest distance","The official closure and the lit alternative"],"ans":2,"why":"An official closure and a safer alternative are concrete facts.","next":"A digital Christmas gift suddenly appears to be “urgent” …","clue":"A sign reads 'Park closed until tomorrow'. Arrows point to an open, lit main street and an unfamiliar, unlit gorge shortcut.","good":"Offer directions kindly if someone seems lost, without intruding.","faith":"Mercy begins by noticing what someone truly needs."}},{"n":18,"icon":"📱","category":"digital","de":{"title":"Die E-Mail vom falschen Weihnachtsmann","story":"„Nur heute: Dein Geschenk wartet! Bestätige sofort deine Kreditkarte.“ Mara musste lachen: Selbst der Weihnachtsmann würde sie nicht so unter Druck setzen. Sie öffnete keinen Link, prüfte den Absender und suchte die offizielle Webseite unabhängig auf. Das achtzehnte Licht glitzerte im Posteingang – ganz ohne Klick. Die echte Gemeindeseite kündigte stattdessen ein öffentliches Adventssingen in der Kirche an – ganz ohne Zahlungsaufforderung.","tip":"Vorsicht bei dringlichen Nachrichten mit Links, Zahlungsaufforderungen oder unerwarteten Anhängen. Gehe bei Zweifeln selbst über die offizielle Website.","heart":"Ein Geschenk, das Druck macht, darfst du liegen lassen.","q":"Welches Indiz ist am stärksten?","opts":["Abweichende Domain und Kartendaten-Forderung","Das Wort »Weihnachten«","Ein Geschenk-Symbol"],"ans":0,"why":"Fremde Domain und Aufforderung zu sensiblen Daten sind überprüfbare Warnsignale.","next":"Eine Karte mit seltsamen Zahlen führt zur nächsten Spur …","clue":"Die E-Mail gibt sich als Gemeinde aus. Der Absender endet auf »@gratis-geschenk.example«, die offizielle Gemeinde-Website auf »winterhain.ch«. Die Nachricht verlangt sofort die Kreditkartennummer.","good":"Warne eine vertraute Person vor einer verdächtigen Nachricht, ohne Angst zu verbreiten.","faith":"Wahrheit schützt Vertrauen – auch bei digitalen Nachrichten."},"en":{"title":"The Email from a Fake Santa","story":"“Today only! Your gift is waiting. Confirm your card details immediately.” Mara laughed: even Santa would not put her under that kind of pressure. She avoided the link, checked the sender and independently navigated to the official website. The eighteenth light sparkled in her inbox—without a click. The official town website instead announced a public Advent carol service at church – with no request for payment.","tip":"Be cautious with urgent messages containing links, payment demands or unexpected attachments. When unsure, navigate independently to the official site.","heart":"You can leave a “gift” that comes with pressure untouched.","q":"Which evidence is strongest?","opts":["Mismatched sender domain and request for card details","The word 'Christmas'","A gift symbol"],"ans":0,"why":"The mismatched domain and request for sensitive data are verifiable warning signs.","next":"A card with strange numbers reveals the next clue …","clue":"An email claims to come from the town office. The sender ends in '@free-gift.example', while the official town domain is 'winterhaven.ch'. The message urgently demands card details.","good":"Help someone recognise a suspicious message without spreading fear.","faith":"Truth protects trust, including online."}},{"n":19,"icon":"☎️","category":"emergency","de":{"title":"Die Zahlen auf dem goldenen Band","story":"An einer Brücke hing ein goldenes Band voller Zahlen. „Nicht jede Nummer gilt überall“, las Mara. Sie prüfte die örtlichen Notrufnummern an einer offiziellen Stelle und speicherte sie für ihre Reise. Als eine Glocke neunzehnmal schlug, erschien Stern Nummer neunzehn.","tip":"Speichere die offiziellen örtlichen Notrufnummern vor einer Reise. 112 ist in EU-Ländern ein allgemeiner Notruf, aber nicht weltweit gleich nutzbar. Im Ernstfall sofort örtliche Hilfe kontaktieren.","heart":"Gut vorbereitet zu sein bedeutet, im richtigen Moment handeln zu können.","q":"Welche Nummer passt zu den angegebenen Hinweisen?","opts":["911","144","112 als US-Notruf"],"ans":1,"why":"Für die Schweizer Sanität ist 144 die spezifische Nummer. Auch 112 ist in der Schweiz als allgemeiner Notruf erreichbar.","next":"Ein kleines Geschenk wartet an der Erste-Hilfe-Station …","clue":"Die Brücke trägt drei beschriftete Schilder: »Schweiz: Rettung 144«, »Deutschland: allgemeiner Notruf 112«, »USA: Notruf 911«. Mara befindet sich in der Schweiz und braucht medizinische Hilfe.","good":"Schreibe wichtige Kontaktnummern für eine vertraute Person auf.","faith":"Wenn wir um Hilfe bitten, zeigen wir nicht Schwäche, sondern Verantwortung."},"en":{"title":"The Numbers on the Golden Ribbon","story":"A golden ribbon covered in numbers hung across a bridge. “Not every number works everywhere,” Mara read. She checked the destination’s official emergency numbers and saved them for her trip. As a bell chimed nineteen times, star nineteen appeared.","tip":"Save verified local emergency numbers before a trip. 112 is a general emergency number in EU countries but is not universally available worldwide. In an emergency, contact local services immediately.","heart":"Being prepared means knowing how to act when it matters.","q":"Which number matches the stated destination and service?","opts":["911","144","112 as the US number"],"ans":1,"why":"144 is the specific Swiss ambulance number. Switzerland also supports 112 as a general emergency number.","next":"A small gift is waiting at the first-aid station …","clue":"The bridge shows three labelled signs: 'Switzerland: ambulance 144', 'Germany: general emergency 112' and 'USA: emergency 911'. Mara is in Switzerland and needs medical help.","good":"Help someone you know note down useful emergency contacts.","faith":"Asking for help can be an act of responsibility, not weakness."}},{"n":20,"icon":"🩹","category":"people","de":{"title":"Das Geschenk der ruhigen Stimme","story":"Vor der Apotheke war jemand auf dem glatten Pflaster ausgerutscht. Mara hielt sicheren Abstand zu vorbeifahrenden Fahrzeugen, fragte nach dem Befinden und alarmierte Hilfe, als sie gebraucht wurde. Ein Passant brachte eine Decke. Neben dem Eingang hing Stern zwanzig. Darauf stand: „Hilfe beginnt mit Ruhe und Umsicht.“","tip":"Bei einem Vorfall zuerst auf die eigene Sicherheit achten, die Lage einschätzen und bei Bedarf den örtlichen Notruf wählen. Nur Hilfe leisten, die du sicher beherrschst.","heart":"Mitgefühl ist besonders wertvoll, wenn es achtsam ist.","q":"Wer kann zunächst mit dem geringsten zusätzlichen Risiko Hilfe organisieren?","opts":["B","C","A"],"ans":2,"why":"A kann von einem sicheren Standort aus nachfragen und professionelle Hilfe rufen.","next":"Ein neues Licht führt Mara zurück zum Bahnhof …","clue":"Nach einem Sturz liegt jemand auf dem Gehweg. Drei Menschen bieten Hilfe: A steht sicher auf dem freien Trottoir, B direkt im Straßenverkehr, C auf einer vereisten Treppe ohne Halt.","good":"Bedanke dich bei einer Person, die im Notfall oder im Alltag hilft.","faith":"Gott schenkt uns Mitgefühl und Vernunft. Beides hilft uns, umsichtig zu handeln."},"en":{"title":"The Gift of a Calm Voice","story":"Outside the pharmacy, someone slipped on the icy pavement. Mara stayed clear of traffic, asked whether the person was all right and called for help when needed. A passer-by fetched a blanket. Star twenty hung beside the door, reading: “Helping begins with calm attention.”","tip":"At an incident, protect your own safety first, assess the situation and contact local emergency services when needed. Only give aid you can provide safely.","heart":"Compassion is most valuable when paired with care.","q":"Who can organise help with the least added risk?","opts":["B","C","A"],"ans":2,"why":"A can ask and call for professional assistance from a safe position.","next":"A new light leads Mara back to the station …","clue":"After a fall on a snowy pavement, three people offer help: A stands safely on a clear sidewalk, B is in moving traffic, C is on icy stairs without support.","good":"Thank someone who helps people in emergencies or daily life.","faith":"God gives us compassion and reason; both help us act thoughtfully."}},{"n":21,"icon":"🚋","category":"transport","de":{"title":"Die Reise der kleinen Glocke","story":"Am Bahnhof läutete eine winzige Glocke, obwohl niemand sie berührte. Ein Kind suchte seine Familie. Mara blieb ruhig, sprach das Zugpersonal an und half, ohne das Kind an einen abgelegenen Ort mitzunehmen. Als die Familie sich wiederfand, leuchtete Stern einundzwanzig heller als alle anderen.","tip":"Wenn jemand Hilfe sucht, wähle sichere, offizielle Ansprechstellen. Personal und örtliche Behörden können helfen; vermeide unnötige Risiken oder Konfrontation.","heart":"Ein wiedergefundenes Lächeln ist ein echtes Weihnachtswunder.","q":"Wohin sollte das Bahnpersonal zuerst den beschriebenen Ort prüfen?","opts":["Zum Café","Zum Informationsschalter bei Gleis 1","Zum Nordausgang"],"ans":1,"why":"Nur B stimmt mit der konkreten Ortsangabe überein. Ein Kind nicht eigenmächtig wegführen; Personal einschalten.","next":"Nur noch drei Sterne fehlen. Doch der Himmel verdunkelt sich …","clue":"Ein Kind sagt: »Meine Familie wartet am Informationsschalter.« Auf dem Lageplan sind drei markierte Orte: A Café, B Informationsschalter beim Bahnsteig 1, C Ausgang Nord.","good":"Unterstütze eine Organisation, die Familien oder Kinder begleitet.","faith":"Jesus nahm Kinder ernst. Ihr Schutz und ihre Würde liegen uns besonders am Herzen."},"en":{"title":"The Little Bell’s Journey","story":"A tiny bell rang at the station, though nobody touched it. A child was looking for their family. Mara stayed calm, contacted train staff and helped without taking the child somewhere isolated. When the family reunited, star twenty-one shone brighter than all the others.","tip":"When someone needs assistance, use safe, official points of contact. Staff and local authorities can help; avoid unnecessary risk or confrontation.","heart":"A reunited smile is a real Christmas miracle.","q":"Which location should station staff verify first?","opts":["The café","The information desk near platform 1","The north exit"],"ans":1,"why":"Only B matches the described place. Do not take the child away yourself; involve station staff.","next":"Only three stars remain—but the sky is darkening …","clue":"A child says: 'My family is waiting by the information desk.' The station map marks three places: A café, B information desk near platform 1, C north exit.","good":"Support an organisation that helps families or children.","faith":"Jesus welcomed children; their safety and dignity deserve special care."}},{"n":22,"icon":"🌟","category":"preparation","de":{"title":"Der Mut, kurz innezuhalten","story":"Der Wind heulte, und Mara fand den nächsten Stern nicht. Dann dachte sie an alle Hinweise: beobachten, einschätzen, entscheiden, handeln. Sie trat ins Warme, atmete ruhig und überlegte neu. Als sie wieder hinaussah, strahlte Stern zweiundzwanzig an der Kirchturmuhr. Er war die ganze Zeit da gewesen.","tip":"Vorbereitung kann nicht jeden Vorfall verhindern. Sie kann dich mental auf unerwartete Situationen vorbereiten, Entscheidungen erleichtern und helfen, Risiken und Folgen zu mindern.","heart":"Mut bedeutet manchmal, kurz innezuhalten und neu zu wählen.","q":"Welcher Begriff schließt die Entscheidungsfolge logisch?","opts":["Weglaufen","Raten","Entscheiden"],"ans":2,"why":"Erst die Lage beobachten und einschätzen, dann eine angemessene Handlung wählen und umsetzen.","next":"Eine letzte Spur führt zum Haus mit dem roten Dach …","clue":"Auf dem Stern stehen vier Schritte: »Beobachten → Einschätzen → ? → Handeln«. Der dritte Schritt fehlt.","good":"Nimm dir fünf Minuten, um wirklich zuzuhören.","faith":"Ein kurzer Moment der Stille kann Raum für Gebet und eine gute Entscheidung schaffen."},"en":{"title":"The Courage to Pause Briefly","story":"The wind howled, and Mara could not find the next star. She remembered the guidance: observe, assess, decide, act. She stepped somewhere warm, took a calm breath and considered her options. When she looked out again, star twenty-two was shining on the church clock. It had been there all along.","tip":"Preparation cannot prevent every incident. It can help you feel mentally ready for unexpected situations, make better decisions and reduce risks and consequences.","heart":"Sometimes courage means pausing briefly and choosing again.","q":"Which word completes the sequence?","opts":["Run away","Guess","Decide"],"ans":2,"why":"Observe and assess first, then choose a suitable response and act.","next":"The final clue leads to the house with the red roof …","clue":"The star lists four steps: 'Observe → Assess → ? → Act'. The third step is missing.","good":"Take five minutes to listen to someone attentively.","faith":"A moment of stillness can make room for prayer and a wiser decision."}},{"n":23,"icon":"🎅","category":"people","de":{"title":"Der Mann mit dem roten Mantel","story":"Vor dem Haus mit dem roten Dach stand eine Gestalt im roten Mantel. Mara blieb auf dem beleuchteten Weg und sprach sie erst an, als die Situation übersichtlich war. Der Mann drehte sich um: Es war der Weihnachtsmann! In seiner Hand glitzerte Stern dreiundzwanzig. „Du hast die Lichter gefunden“, sagte er, „doch weißt du, wofür sie da sind?“","tip":"Beurteile Situationen nach beobachtbarem Verhalten und deinen sicheren Handlungsmöglichkeiten, nicht nach bloßen Vermutungen oder Äußerlichkeiten.","heart":"Wahre Aufmerksamkeit lässt Platz für Überraschungen.","q":"Was lässt sich aus den Angaben sicher schließen?","opts":["Alle drei sind der Weihnachtsmann","Der größte Mantel gehört dem Helfer","Aus der Mantelfarbe lässt sich keine Hilfsbereitschaft ableiten"],"ans":2,"why":"Aussehen beweist keine Absicht. Entscheidend sind beobachtbare Handlungen.","next":"Morgen öffnet sich das vierundzwanzigste Türchen – und das Geheimnis …","clue":"Drei Personen tragen rote Mäntel. Eine bringt Holz, eine verteilt Plätzchen, eine spricht mit Kindern. Auf der Karte steht: »Der Mantel allein verrät dir nicht, wer helfen wird.«","good":"Bringe einer Person eine kleine Aufmerksamkeit – ohne Gegenleistung zu erwarten.","faith":"Gutes zu tun braucht kein großes Publikum. Oft zählt die kleine, stille Tat."},"en":{"title":"The Man in the Red Coat","story":"Outside the house with the red roof stood a figure in a red coat. Mara stayed on the lit path and approached only when the situation was clear. The man turned around: it was Santa! Star twenty-three glittered in his hand. “You found the lights,” he said, “but do you know what they are for?”","tip":"Judge situations by observable behaviour and your safe options, not by assumptions or appearances alone.","heart":"True awareness leaves space for wonderful surprises.","q":"What can the evidence actually establish?","opts":["All three must be Santa","The tallest person must be the helper","You cannot infer willingness to help from coat colour"],"ans":2,"why":"Appearance cannot prove intent; observable actions are better evidence.","next":"Tomorrow, door twenty-four opens—and so does the secret …","clue":"Three people wear red coats. One carries wood, one shares biscuits, one talks to children. The card says: 'A coat alone cannot tell you who will help.'","good":"Offer someone a small kindness without expecting anything back.","faith":"Doing good needs no audience. Quiet acts of kindness often matter most."}},{"n":24,"icon":"❤️","category":"heart","de":{"title":"Das vierundzwanzigste Licht","story":"Der Weihnachtsmann führte Mara zum Dorfplatz. Die dreiundzwanzig Sterne schwebten über den Häusern, und ein Platz in der Mitte blieb leer. „Das letzte Licht“, sagte er, „ist die Wärme, die Menschen einander schenken.“ Mara dachte an all die kleinen Entscheidungen und Hilfen ihrer Reise. Als sie lächelte, leuchtete ein rotes Herz. Winterhain erstrahlte. Das Geheimnis war nicht Magie allein, sondern Achtsamkeit, Vorbereitung und Menschlichkeit. In der Kirche nebenan stand die Krippe. Mara blieb einen Moment vor dem Jesuskind stehen. Sie verstand: Der Stern weist nicht auf Macht oder Besitz, sondern auf Liebe, Hoffnung und den Mut, füreinander da zu sein.","tip":"Sicherheit ist Vorbereitung: aufmerksam bleiben, bewusst entscheiden, Hilfe annehmen und anderen helfen, ohne dich selbst zu gefährden. Kein Tipp garantiert Sicherheit, aber gute Vorbereitung kann viel bewirken.","heart":"Frohe Weihnachten! Ich wünsche dir und deinen Liebsten ruhige Feiertage, Zuversicht und viele sichere, schöne Wege. Von Herzen – Sebastian Salomon Svoboda.","q":"Welches Symbol löst das letzte Rätsel?","opts":["Die offene Hand","Der leere Geschenkbeutel","Die Münzschachtel"],"ans":0,"why":"Die offene Hand steht für Nächstenliebe und das freiwillige Weitergeben von Gutem.","next":"Die Geschichte endet. Das Licht darfst du mit ins neue Jahr nehmen. ❤️","clue":"Auf dem Krippenplatz schwebt ein Kreis mit 23 Sternen. Eine Inschrift sagt: »Der vierundzwanzigste steht nicht für Besitz, sondern für Liebe, die weitergegeben wird.« Darunter sind ein leerer Geschenkbeutel, eine offene Hand und eine Münzschachtel abgebildet.","good":"Wähle heute eine konkrete gute Tat und mache sie zum Weihnachtsgeschenk.","faith":"An Weihnachten feiern Christen die Geburt Jesu. Die Weihnachtsfreude lebt weiter, wenn wir Liebe und Hoffnung teilen."},"en":{"title":"The Twenty-Fourth Light","story":"Santa led Mara to the village square. Twenty-three stars hovered above the houses, leaving one space empty in the middle. “The final light,” he said, “is the warmth people give one another.” Mara remembered the small choices and acts of help along her journey. As she smiled, a red heart began to glow. Winterhaven lit up. The secret was not magic alone, but awareness, preparation and kindness. The church beside the square held a nativity scene. Mara paused before the Christ child and understood: the star pointed not to power or possessions, but to love, hope and the courage to care for one another.","tip":"Security is preparation: stay aware, make thoughtful choices, accept help and support others without putting yourself in danger. No advice guarantees safety, but good preparation can make a real difference.","heart":"Merry Christmas! I wish you and your loved ones peaceful holidays, confidence and many safe and beautiful journeys. With warmest wishes – Sebastian Salomon Svoboda.","q":"Which symbol solves the final mystery?","opts":["The open hand","The empty gift sack","The coin box"],"ans":0,"why":"The open hand symbolises love of neighbour and freely sharing kindness.","next":"The story ends. Take its light with you into the new year. ❤️","clue":"At the nativity square, 23 stars form a circle. An inscription says: 'The twenty-fourth represents not possession, but love shared with others.' Below are drawings of an empty gift sack, an open hand and a coin box.","good":"Choose one concrete act of kindness and make it your Christmas gift.","faith":"At Christmas, Christians celebrate the birth of Jesus. Christmas joy continues when we share love and hope."}}];

const PREVIEW=false;
const YEAR=2026;
let lang=(()=>{try{return localStorage.getItem('smart_advent_lang')==='en'?'en':'de'}catch(e){return 'de'}})();
const saved=readState();
let currentDay=null,lastFocus=null,snowOn=true;
const $=id=>document.getElementById(id);
const tr=key=>UI[lang][key];
const fmt=(key,n)=>tr(key).replace('{n}',String(n));
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function readState(){try{const v=JSON.parse(localStorage.getItem('smart_advent_state_2026')||'{}');return {solved:Array.isArray(v.solved)?v.solved.filter(x=>Number.isInteger(x)&&x>=1&&x<=24):[],hearts:Array.isArray(v.hearts)?v.hearts.filter(x=>Number.isInteger(x)&&x>=1&&x<=24):[]}}catch(e){return {solved:[],hearts:[]}}}
function store(){try{localStorage.setItem('smart_advent_state_2026',JSON.stringify(saved))}catch(e){}}
function available(){if(PREVIEW)return 24;const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();if(y<YEAR||(y===YEAR&&m<12))return 0;if(y>YEAR)return 24;if(m===12)return Math.min(24,d);return 24}
function buildSnow(){const cont=$('snow');cont.innerHTML='';for(let i=0;i<65;i++){const n=document.createElement('i');n.className='snow';let x=(i*137.37)%100,size=1.8+(i*5.63)%5.2;Object.assign(n.style,{left:x+'%',width:size+'px',height:size+'px',opacity:String(.24+(i*3.71%65)/100),animationDuration:(9+(i*7.17)%13)+'s',animationDelay:(-1*(i*2.93%22))+'s'});cont.append(n)}for(let i=0;i<10;i++){const s=document.createElement('span');s.className='sparkle';s.textContent='✦';Object.assign(s.style,{left:((i*19+7)%92)+'%',top:((i*23+11)%76)+'%',fontSize:(8+i%3*7)+'px',animationDelay:(i*.4)+'s'});cont.append(s)}}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});$('heroTitle').innerHTML=tr('heroTitle');$('langBtn').textContent=lang==='de'?'EN':'DE';$('liveLabel').textContent=tr('liveLabel');$('previewRibbon').hidden=!PREVIEW;$('previewRibbon').textContent=tr('previewLabel');$('calendarHint').textContent=tr(PREVIEW?'previewHint':'calendarHint');const max=available();$('currentBanner').textContent=PREVIEW?tr('previewHint'):(max===0?tr('startSoon'):max===24?tr('allOpen'):fmt('afterStart',max));const completed=saved.solved.length;$('progressSub').textContent=completed+' '+tr('progressUnit');$('progressFill').style.width=(completed/24*100)+'%';$('progressTrack').setAttribute('aria-valuenow',completed);$('heartCount').textContent=saved.hearts.length;renderDoors();}
function renderDoors(){const max=available();$('doorGrid').innerHTML=CHAPTERS.map(c=>{const unlocked=c.n<=max,solved=saved.solved.includes(c.n),heart=saved.hearts.includes(c.n),label=unlocked?tr(solved?'solved':'ready'):fmt('locked',c.n);return `<button type="button" data-door="${c.n}" class="door ${unlocked?'':'door-locked'} ${solved?'door-solved':''} ${c.n===24?'door24':''}" data-tone="${c.n%5+1}" aria-label="${esc(c.n+'. '+label)}"><span class="door-inner"><span class="door-no">${c.n}</span><span class="door-emoji" aria-hidden="true">${unlocked?c.icon:'❄️'}</span><span class="door-label">${esc(label)}</span>${!unlocked?'<span class="lock-ic" aria-hidden="true">🔒</span>':heart?'<span class="door-heart" aria-hidden="true">❤️</span>':''}</span></button>`}).join('');}
function showToast(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function openDoor(n){const c=CHAPTERS[n-1];if(!c)return;if(n>available()){showToast(fmt('lockedText',n));return;}currentDay=n;lastFocus=document.activeElement;const d=c[lang];$('modalEyebrow').textContent=fmt('reveal',n)+' '+c.icon;$('modalTitle').textContent=d.title;const solved=saved.solved.includes(n);delete $('modalBody').dataset.choice;$('modalBody').innerHTML=`<div class="detail-block"><div class="detail-label">📖 ${esc(tr('story'))}</div><p class="story-text">${esc(d.story)}</p></div><div class="detail-block"><div class="detail-label">🛡️ ${esc(tr('tip'))}</div><div class="tip-box">${esc(d.tip)}</div></div><div class="detail-block"><div class="detail-label">❤️ ${esc(tr('heart'))}</div><div class="heart-box"><span class="bigheart">♥</span><span class="heart-text">${esc(d.heart)}</span></div></div><div class="quiz-box"><div class="detail-label">🕵️ ${esc(tr('quiz'))}</div><p class="puzzle-instructions">${esc(tr('quizPrompt'))}</p><div class="clue-box"><div class="clue-label">✦ ${esc(tr('clue'))}</div><p>${esc(d.clue)}</p></div><p class="question">${esc(d.q)}</p><div class="options" id="quizOptions">${d.opts.map((opt,i)=>`<button class="option ${solved&&i===d.ans?'correct':''}" type="button" data-choice="${i}" ${solved?'disabled':''}><span class="circle">${String.fromCharCode(65+i)}</span>${esc(opt)}</button>`).join('')}</div><div class="quiz-action"><button class="btn btn-gold" id="checkAnswer" ${solved?'disabled':''}>${esc(solved?tr('correct'):tr('check'))}</button><span class="quiz-feedback" id="quizFeedback">${solved?esc(tr('quizSuccess')+' '+d.why):''}</span></div></div><div class="faith-box"><div class="detail-label">✝ ${esc(tr('faith'))}</div><p>${esc(d.faith)}</p></div><div class="good-box"><div class="detail-label">🤍 ${esc(tr('good'))}</div><p>${esc(d.good)}</p></div><div class="next-note">✦ ${esc(d.next)}</div><button type="button" class="fave ${saved.hearts.includes(n)?'active':''}" id="heartBtn">${saved.hearts.includes(n)?'❤️ '+esc(tr('unfavourite')):'♡ '+esc(tr('favourite'))}</button>`;
$('overlay').classList.add('open');document.body.style.overflow='hidden';$('modal').scrollTop=0;$('modal').focus();}
function closeModal(){$('overlay').classList.remove('open');document.body.style.overflow='';currentDay=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('doorGrid').addEventListener('click',e=>{const b=e.target.closest('[data-door]');if(b)openDoor(Number(b.dataset.door))});
$('closeBtn').addEventListener('click',closeModal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentDay!==null)closeModal();if(e.key==='Tab'&&currentDay!==null){const focusable=Array.from($('modal').querySelectorAll('button:not([disabled]),a[href]')).filter(x=>x.getBoundingClientRect().width>0);if(focusable.length){const i=focusable.indexOf(document.activeElement);if(e.shiftKey&&i===0){focusable[focusable.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&i===focusable.length-1){focusable[0].focus();e.preventDefault()}}}});
$('modalBody').addEventListener('click',e=>{if(currentDay===null)return;const n=currentDay,d=CHAPTERS[n-1][lang];const option=e.target.closest('[data-choice]');if(option&&!saved.solved.includes(n)){document.querySelectorAll('[data-choice]').forEach(b=>b.classList.remove('selected','incorrect'));option.classList.add('selected');$('modalBody').dataset.choice=option.dataset.choice;}if(e.target.closest('#checkAnswer')){if(saved.solved.includes(n))return;const chosen=Number($('modalBody').dataset.choice);if(!Object.prototype.hasOwnProperty.call($('modalBody').dataset,'choice')){showToast(lang==='de'?'Bitte zuerst eine Antwort wählen.':'Please choose an answer first.');return}if(chosen===d.ans){saved.solved.push(n);store();render();$('modalBody').removeAttribute('data-choice');showToast(tr('quizSuccess'));openDoor(n)}else{document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('incorrect',Number(b.dataset.choice)===chosen));$('quizFeedback').textContent=tr('wrong')}}if(e.target.closest('#heartBtn')){if(saved.hearts.includes(n))saved.hearts=saved.hearts.filter(v=>v!==n);else saved.hearts.push(n);store();render();openDoor(n)}});
$('langBtn').addEventListener('click',()=>{lang=lang==='de'?'en':'de';try{localStorage.setItem('smart_advent_lang',lang)}catch(e){}render();if(currentDay)openDoor(currentDay)});
$('snowBtn').addEventListener('click',()=>{snowOn=!snowOn;$('snow').style.display=snowOn?'':'none';$('snowBtn').style.opacity=snowOn?'1':'.45'});
$('shareBtn').addEventListener('click',async()=>{if(location.protocol==='file:'){showToast(tr('shareNotReady'));return}try{if(navigator.share){await navigator.share({title:'SMART SECURITY Adventskalender',text:tr('shareText'),url:location.href});return}if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast(tr('copyOk'));return}}catch(e){}showToast(location.href)});
$('resetBtn').addEventListener('click',()=>{if(confirm(tr('resetSure'))){saved.solved=[];saved.hearts=[];store();render()}});
buildSnow();render();
</script></body></html>
